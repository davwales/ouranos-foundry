name: Release

# Tag v<godot>.<N> (e.g. v4.6.3.0) on a commit from main to publish:
#   - the `addon` branch (a subtree split of addons/ouranos_foundry) plus an addon-v<godot>.<N> tag,
#     for consumers who use git submodules;
#   - a release zip containing addons/ouranos_foundry/, for consumers who copy it in.
# CI (including the package smoke tests) must pass before anything is published.

on:
  push:
    tags:
      - "v*.*.*.*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        run: Automation/check-release.sh "$GITHUB_REF_NAME"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ouranos_foundry-addon
          path: dist
      - name: Publish addon branch
        run: |
          git subtree split --prefix=addons/ouranos_foundry -b addon
          git push origin addon
          git tag "addon-$GITHUB_REF_NAME" addon
          git push origin "addon-$GITHUB_REF_NAME"
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' addons/ouranos_foundry/CHANGELOG.md > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/ouranos_foundry.zip "dist/ouranos_foundry-$GITHUB_REF_NAME.zip"
          gh release create "$GITHUB_REF_NAME" "dist/ouranos_foundry-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
